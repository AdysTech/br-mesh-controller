; ============================================================
; ESP32-S3-Zero 
; https://docs.waveshare.com/ESP32-S3-Zero
;
;   Chip:    ESP32-S3 (QFN56) rev v0.2, dual-core + LP core, 240 MHz
;   Flash:   4 MB (XMC) embedded, QIO @ 80 MHz
;   PSRAM:   2 MB octal (AP_3v3)
;   USB:     native USB-Serial/JTAG  (no external UART bridge)
;
;   Verified against the connected device via esptool:
;     /home/rao/.platformio/penv/bin/esptool --chip esp32s3 -p /dev/ttyACM0 chip-id
; ============================================================
[env:waveshare_esp32_s3_zero]
platform = https://github.com/pioarduino/platform-espressif32.git
board = waveshare_esp32_s3_zero
framework = arduino

; --- POC build boundary ---
; The POC (ENABLE_WIFI=0) is just the FastCon bridge + serial console. The bridge
; scaffolding sitting untracked in src/ (settings.*, statusled.*, light.h, web/*)
; is commit-2 work that needs the HA/MQTT + web stack and must NOT be compiled here.
; Scope the build to the two POC sources so the POC stays self-contained.
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>

monitor_speed = 115200
upload_speed  = 460800

; --- Flash / PSRAM (match the physical chip — do NOT size to 8 MB) ---
board_upload.flash_size = 4MB
board_build.f_flash     = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.maximum_size = 4194304

; 2 MB octal PSRAM (AP_3v3). If a build ever complains about PSRAM,
; drop this line — the board still works, just without the 2 MB of PSRAM.
board_build.arduino.memory_type = qio_qspi

; --- Native USB serial (TinyUSB CDC over the native USB port) ---
; Without these, Serial falls back to UART0 on GPIO43/44 and /dev/ttyACM0
; stays silent (see cores/esp32/HardwareSerial.h: Serial = HWCDCSerial only
; when ARDUINO_USB_CDC_ON_BOOT && ARDUINO_USB_MODE).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- 4 MB partition table (2 MB app + 896K ffat for littlefs) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- Libraries ---
; BLE stack: NimBLE-Arduino (NimBLE host) instead of the classic Bluedroid stack.
;   - The proven bulb code uses the same advertise+scan primitives, re-exposed
;     under the NimBLE-Arduino API (NimBLEDevice / NimBLEAdvertising / NimBLEScan).
;   - Choosing NimBLE now means the later Improv-WiFi provisioning (also NimBLE)
;     shares ONE host stack — no link conflict. lora-relay proves this lib compiles
;     and runs on the same pioarduino core.
;   - protocol.cpp is stack-agnostic and stays byte-identical.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1

; HA/MQTT bridge (re-enable with ENABLE_WIFI=1 in config.h): provides HADevice /
; HAMqtt / HALight and pulls in PubSubClient for MQTT.
;   dawidchyrzynski/home-assistant-integration@^2.1.0

; --- Port: board is plugged in locally over native USB ---
upload_port  = /dev/ttyACM0
monitor_port = /dev/ttyACM0
