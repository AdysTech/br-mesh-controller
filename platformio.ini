; ============================================================
; ESP32-S3-Zero 
; https://docs.waveshare.com/ESP32-S3-Zero
;
;   Chip:    ESP32-S3 (QFN56) rev v0.2, dual-core + LP core, 240 MHz
;   Flash:   4 MB (XMC) embedded, QIO @ 80 MHz
;   PSRAM:   2 MB octal (AP_3v3)
;   USB:     native USB-Serial/JTAG  (no external UART bridge)
;
;   Verified against the connected device via esptool:
;     /home/rao/.platformio/penv/bin/esptool --chip esp32s3 -p /dev/ttyACM0 chip-id
; ============================================================
[env:waveshare_esp32_s3_zero]
platform = https://github.com/pioarduino/platform-espressif32.git
board = waveshare_esp32_s3_zero
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; --- Flash / PSRAM (match the physical chip — do NOT size to 8 MB) ---
board_upload.flash_size = 4MB
board_build.f_flash     = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.maximum_size = 4194304

; 2 MB octal PSRAM (AP_3v3). If a build ever complains about PSRAM,
; drop this line — the board still works, just without the 2 MB of PSRAM.
board_build.arduino.memory_type = qio_qspi

; --- Native USB serial (TinyUSB CDC over the native USB port) ---
; Without these, Serial falls back to UART0 on GPIO43/44 and /dev/ttyACM0
; stays silent (see cores/esp32/HardwareSerial.h: Serial = HWCDCSerial only
; when ARDUINO_USB_CDC_ON_BOOT && ARDUINO_USB_MODE).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; --- 4 MB partition table (2 MB app + 896K ffat for littlefs) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; --- Libraries ---
; POC (ENABLE_WIFI=0, BLE-only): NO external libs. The classic ESP32 BLE stack
; (BLEDevice / BLEAdvertising / BLEScan) ships with the Arduino core itself.
;
; To switch to the HA/MQTT bridge later: set ENABLE_WIFI=1 in config.h and
; re-add this lib (it provides HADevice/HAMqtt/HALight, and pulls in
; PubSubClient for MQTT):
;   lib_deps =
;       dawidchyrzynski/home-assistant-integration@^2.1.0

; --- Port: board is plugged in locally over native USB ---
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM0
