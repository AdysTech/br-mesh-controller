; ============================================================
; ESP32-S3-Zero
; https://docs.waveshare.com/ESP32-S3-Zero
;
;   Chip:    ESP32-S3 (QFN56) rev v0.2, dual-core + LP core, 240 MHz
;   Flash:   4 MB (XMC) embedded, QIO @ 80 MHz
;   PSRAM:   2 MB octal (AP_3v3)
;   USB:     native USB-Serial/JTAG  (no external UART bridge)
;
;   Verified against the connected device via esptool:
;     /home/rao/.platformio/penv/bin/esptool --chip esp32s3 -p /dev/ttyACM0 chip-id
;
; One board, one build:
;   waveshare_esp32_s3_zero — bridge firmware: BLE FastCon engine + serial
;                             console + (Phase 0) WiFi STA + Improv BLE
;                             provisioning. Web (Phase 1) and HA/MQTT
;                             (Phase 3) land as the phases progress.
; ============================================================

; ============================================================
[env:waveshare_esp32_s3_zero]
platform = https://github.com/pioarduino/platform-espressif32.git
board = waveshare_esp32_s3_zero
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; --- Flash / PSRAM (match the physical chip — do NOT size to 8 MB) ---
board_upload.flash_size = 4MB
board_build.f_flash     = 80000000L
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.maximum_size = 4194304

; 2 MB octal PSRAM (AP_3v3). If a build ever complains about PSRAM,
; drop this line — the board still works, just without the 2 MB of PSRAM.
board_build.arduino.memory_type = qio_qspi

; --- 4 MB partition table (dual OTA slots + A/B spiffs SPA slots) ---
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; Dual spiffs partitions (spa_a/spa_b) — uploadfs targets the active slot
board_build.filesystem_partition = spa_a

; --- Native USB serial (TinyUSB CDC over the native USB port) ---
; Without these, Serial falls back to UART0 on GPIO43/44 and /dev/ttyACM0
; stays silent (see cores/esp32/HardwareSerial.h: Serial = HWCDCSerial only
; when ARDUINO_USB_CDC_ON_BOOT && ARDUINO_USB_MODE).
; -DIMPROV_WIFI_BLE_ENABLED: compile the ImprovWiFiBLE (BLE) backend.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIMPROV_WIFI_BLE_ENABLED
    -DBOARD_HAS_PSRAM
    
; --- SPA build (Phase 2) ----------------------------------------------------
; tools/build_spa.py runs before compilation + upload: Svelte -> single-file
; HTML -> gzip -> data/index.html.gz (+ data/spa.version) for LittleFS.
; tools/auto_uploadfs.py is a pre-UPLOAD hook (lora-relay pattern): if the SPA
; *source* is newer than the last upload, it flashes the LittleFS SPA first,
; so `pio run -t upload` can never ship a new firmware against a stale UI.
; See the lora-relay pipeline (same shape).
extra_scripts =
    tools/build_spa.py
    tools/auto_uploadfs.py

; --- Libraries ---
; BLE stack: NimBLE-Arduino (NimBLE host) instead of classic Bluedroid.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
    https://github.com/jnthas/Improv-WiFi-Library.git

; --- Port: board is plugged in locally over native USB ---
; (serial port CAN swap ACM0<->ACM1 on power-cycle — override with ESP_SERIAL_PORT)
upload_port  = /dev/ttyACM1
monitor_port = /dev/ttyACM1



; The board. Phase 0: §5 boot gating (NVS creds -> bounded STA -> Improv BLE
; provisioning) + the console `prov` re-entry. Phase 1: web/* (httpd shell,
; SPA fallback, /ws/log).
build_src_filter =
    +<main.cpp>
    +<protocol.cpp>
    +<MeshController.cpp>
    +<console.cpp>
    +<settings.cpp>
    +<statusled.cpp>
    +<web/WebLog.cpp>
    +<web/ApiHttp.cpp>
    +<web/WebServer.cpp>
    +<web/ApiLights.cpp>
    +<web/ApiSystem.cpp>
    +<HaBridge.cpp>
